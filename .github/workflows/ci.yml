name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The flashcard-markdown parser and the Anki field builder are the main
      # logic left in this repo: the parser protects the decks from silently
      # shrinking, and the field builder decides what actually lands in an
      # Anki field (escaping, and markdown lists to <ul>/<ol>).
      - name: Unit tests
        run: node --test scripts/lib/*.test.mjs

      # scripts/fetch-doc.mjs and each cheatsheet's shared-scaffold block are
      # the last things every module still shares byte-for-byte. Modules are
      # auto-discovered (same flashcards.md convention as the Anki export
      # below), so adding one needs no workflow edit.
      - name: Check drift (fetch-doc.mjs + cheatsheet scaffold)
        run: node scripts/check-drift.mjs

      # Parses every module's flashcards.md and asserts card shape and
      # cross-deck ID uniqueness. Modules are auto-discovered, so adding
      # one needs no workflow edit.
      - name: Anki export (parse + cross-deck ID assertions)
        run: node scripts/export-anki.mjs
