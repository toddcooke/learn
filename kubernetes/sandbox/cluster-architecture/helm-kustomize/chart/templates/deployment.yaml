# This file is NOT valid YAML. It is a Go text/template that happens to look
# like YAML, and it only becomes a manifest after Helm renders it. Feed it
# straight to "kubectl apply -f" and the parser chokes on the doubled braces
# below, which is exactly the trade Helm makes: a real templating language in
# exchange for source files no other Kubernetes tool can read.
#
# Note that Helm renders the WHOLE file, comments included, so the doubled
# braces cannot be mentioned even in a comment without Helm trying to evaluate
# them. Everything below is real substitution:
#
#   .Release.*  is injected by Helm at install time (name, namespace, service)
#   .Chart.*    comes from Chart.yaml
#   .Values.*   comes from values.yaml merged with -f files and --set flags
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-hello
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
