# A deliberately boring Pod. It exists only to be created twice — once in a
# namespace that has a ResourceQuota with no room left, where it is rejected,
# and once in a namespace that has no quota at all, where it starts. Like
# web.yaml it names no namespace, so the same bytes go to both places.
apiVersion: v1
kind: Pod
metadata:
  name: probe
  labels:
    app: probe
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
