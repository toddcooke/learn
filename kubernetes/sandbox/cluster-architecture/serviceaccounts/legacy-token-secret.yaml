# The pre-v1.22 way to get a credential for a ServiceAccount, kept here as a
# counter-example rather than a recommendation.
#
# The type and the annotation together are the whole request: the control plane
# notices a Secret of type kubernetes.io/service-account-token that names an
# existing ServiceAccount and fills in .data.token, .data.ca.crt and
# .data.namespace for you. Nothing else in this file produces a credential.
#
# What comes back is a JWT with no exp claim, bound to no Pod and to no node. It
# is valid until the Secret is deleted or the ServiceAccount is deleted, which
# in practice means "until somebody notices". Kubernetes stopped creating these
# automatically in v1.24; creating one by hand still works and is reserved for
# the cases where TokenRequest genuinely cannot be used, such as a credential
# that has to be handed to a system living outside the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: api-reader-legacy-token
  annotations:
    kubernetes.io/service-account.name: api-reader
type: kubernetes.io/service-account-token
