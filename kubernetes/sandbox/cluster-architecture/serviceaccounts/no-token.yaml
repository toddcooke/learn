# The opt-out. This Pod still runs as the api-reader ServiceAccount — the
# identity is on the object either way — but the kubelet mounts no credential
# for it, so it has no way to prove that identity to the API server.
#
# automountServiceAccountToken can be set on the ServiceAccount (affecting every
# Pod that uses it) or on the Pod (affecting only that Pod). The Pod's setting
# wins. For any workload that never calls the Kubernetes API — which is most of
# them — turning this off removes a live credential from the container
# filesystem for free, and it is the single cheapest hardening step available.
apiVersion: v1
kind: Pod
metadata:
  name: no-token
spec:
  serviceAccountName: api-reader
  automountServiceAccountToken: false
  containers:
    - name: shell
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["sleep", "3600"]
