# A ServiceAccount is almost nothing: a name in a namespace and a UID. It holds
# no rules, grants no permission, and has no password. It exists so that a
# RoleBinding has a subject to name, so the API server has something to write in
# the audit log, and so the kubelet has an identity to mint tokens for.
#
# Every Pod runs as one. A Pod that names none is admitted with the namespace's
# "default" ServiceAccount, which is equally powerless — .spec.serviceAccountName
# is never empty on a Pod that is actually running.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-reader
