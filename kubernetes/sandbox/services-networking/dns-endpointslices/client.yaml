# One in-cluster client Pod carrying two toolboxes, because no single image
# here has both tools this lab needs:
#
#   * dns (agnhost) has nslookup. It is the image the Kubernetes "Debugging DNS
#     Resolution" task uses for exactly this purpose; busybox's nslookup applet
#     has a chequered history with search domains and is not worth trusting for
#     an assertion about search domains.
#   * shell (busybox) has wget, which prints the response body. That matters
#     because the lab has to read *which* backend answered, and it also proves
#     name resolution end to end through the C library's resolver rather than
#     through a DNS-specific tool.
#
# Putting them in one Pod rather than two is deliberate. Containers in a Pod
# share a network namespace, and /etc/resolv.conf is written per Pod, so both
# containers read the identical resolver configuration and query from the
# identical source address. The nslookup answers and the wget results are
# therefore statements about one client, not two.
#
# Note the label: app=client, not app=web. The client must not match the
# Service's selector, or it would become an endpoint of the very Service it is
# inspecting and every endpoint count below would be off by one.
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
    - name: dns
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
