# Three identical HTTP servers, and nothing more interesting than that.
#
# agnhost's netexec answers GET /hostname with the container's hostname, which
# for a Pod is the Pod's name. That single detail is what makes this lab
# assertable: every reply is signed by the replica that produced it, so
# "the Service load balanced" stops being a claim and becomes a count.
#
# The container port is *named* (http). A Service can then say
# `targetPort: http` instead of repeating 8080, and the endpoints controller
# resolves the name to the number when it writes the EndpointSlice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/agnhost", "netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          # A Service adds a Pod to its EndpointSlice as a *ready* endpoint
          # only once the Pod is Ready. Without a readiness probe, "Ready"
          # would mean no more than "the process was started", and asserting
          # "three ready endpoints" would prove correspondingly little.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
