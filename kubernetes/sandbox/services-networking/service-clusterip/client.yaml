# One in-cluster client Pod with two toolboxes in it, because no single image
# here has both tools this lab needs:
#
#   * shell (busybox) has wget, which prints the response body. That matters
#     because the lab has to read *which* backend answered; `agnhost connect`
#     reports only whether a TCP connection opened.
#   * dns (agnhost) has nslookup. It is the image the Kubernetes DNS-debugging
#     task recommends for exactly this — newer busybox builds have a chequered
#     history with nslookup and search domains.
#
# Putting them in one Pod rather than two is deliberate: containers in a Pod
# share a network namespace, so both see the identical /etc/resolv.conf and the
# identical source address. The DNS answers in step 6 are therefore the answers
# the wget client in step 4 was working from, not a second opinion.
#
# Note the label: app=client, not app=web. The client must not match either
# Service's selector, or it would become an endpoint of the very Services it is
# testing and the endpoint counts would be off by one.
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
    - name: dns
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
