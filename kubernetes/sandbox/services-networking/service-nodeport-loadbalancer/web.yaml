# The backend, and the client we probe it from.
#
# One replica, not two, and that single number is what makes the lab provable.
# With exactly one Pod on exactly one node, "a NodePort answers on every node"
# stops being a slogan you could confirm by accident and becomes a claim with a
# sharp edge: two of the three nodes run no copy of this application at all, and
# they must still serve the port. Had we asked for three replicas, a request to
# any node could have been handled locally and we would have learned nothing.
#
# The readiness probe is not decoration either. A Service's EndpointSlice
# contains only *ready* endpoints, so readiness is the switch that puts this Pod
# into the routing tables of every node's kube-proxy — and takes it out again the
# moment it stops answering.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/agnhost", "netexec", "--http-port=8080"]
          ports:
            # This name is documentation, not configuration. A containerPort
            # entry does not open, publish or firewall anything; the process
            # binds 8080 whether or not this block exists. What it buys is the
            # ability for a Service to say `targetPort: http` instead of a
            # number, which the Services in this lab deliberately do not do so
            # that the port arithmetic stays visible.
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hostname
              port: 8080
            periodSeconds: 2
---
# A plain shell with wget in it. Every request in this lab is issued from here,
# from inside the cluster, aimed at a node's own IP — which is the only way to
# demonstrate the NodePort path on a kind cluster whose node IPs live on a Docker
# bridge the host does not route to.
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "3600"]
