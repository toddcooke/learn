# The same hostPath, pointed at the other worker.
#
# Byte for byte this is hostpath.yaml with one label changed, and that one label
# is the difference between a Pod that runs and a Pod that never starts. The
# probe file was only ever created on cka-sandbox-worker, so on
# cka-sandbox-worker2 the `type: File` check fails and the kubelet reports
# FailedMount forever. Nothing about the manifest is wrong; it is simply talking
# about a filesystem that exists on one machine.
apiVersion: v1
kind: Pod
metadata:
  name: elsewhere
  labels:
    app: elsewhere
spec:
  terminationGracePeriodSeconds: 2
  nodeSelector:
    kubernetes.io/hostname: cka-sandbox-worker2
  volumes:
    - name: probe-file
      hostPath:
        path: /tmp/sandbox-volumes-probe
        type: File
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: probe-file
          mountPath: /node/probe.txt
          readOnly: true
