# A Pod that reads a file off its node's own filesystem.
#
# Two things make this work, and both are the point of the lab. The nodeSelector
# pins the Pod to cka-sandbox-worker, because a hostPath means nothing until you
# know which host; and `type: File` makes the kubelet refuse to mount unless a
# regular file really is sitting at that path on that node.
#
# Both mounts are readOnly, which is the minimum hygiene for a hostPath: the
# node's filesystem is the cluster's trust boundary, and a writable mount of a
# node directory hands it to whoever can create a Pod.
apiVersion: v1
kind: Pod
metadata:
  name: node-reader
  labels:
    app: node-reader
spec:
  terminationGracePeriodSeconds: 2
  nodeSelector:
    kubernetes.io/hostname: cka-sandbox-worker
  volumes:
    # Scoped to exactly one file — the narrowest hostPath you can write.
    - name: probe-file
      hostPath:
        path: /tmp/sandbox-volumes-probe
        type: File
    # The same node directory the probe file lives in, to show that a hostPath
    # is a window onto the node rather than a copy of anything.
    - name: node-tmp
      hostPath:
        path: /tmp
        type: Directory
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: probe-file
          mountPath: /node/probe.txt
          readOnly: true
        - name: node-tmp
          mountPath: /node-tmp
          readOnly: true
