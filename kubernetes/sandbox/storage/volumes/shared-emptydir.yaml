# One Pod, two containers, two emptyDir volumes.
#
# `scratch` is a plain emptyDir. When the Pod is assigned to a node the kubelet
# creates an empty directory there, both containers bind-mount it, and the
# directory is deleted when the Pod is removed from the node.
#
# `cache` asks for medium: Memory, which is the same API field pointing at a
# completely different backing store: the kubelet mounts a tmpfs instead of
# handing out a directory on disk. sizeLimit caps it; without one, a
# memory-backed emptyDir is sized to the node's allocatable memory.
#
# The `writer` container's command is this lab's restart button. It appends one
# line to starts.log every time it starts, then blocks until somebody creates
# /scratch/restart-me, removes that sentinel and exits non-zero. The Pod's
# restartPolicy defaults to Always, so the kubelet restarts that one container
# and leaves the Pod object — and therefore both volumes — exactly where it is.
apiVersion: v1
kind: Pod
metadata:
  name: shared
  labels:
    app: shared
spec:
  # Both commands run as PID 1 with no SIGTERM handler installed, and PID 1 in
  # a namespace ignores signals it has no handler for. Without this the lab
  # would spend the full 30-second default grace period waiting for processes
  # that were never going to leave on their own.
  terminationGracePeriodSeconds: 2
  volumes:
    - name: scratch
      emptyDir: {}
    - name: cache
      emptyDir:
        medium: Memory
        sizeLimit: 32Mi
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "container started" >> /scratch/starts.log
          while [ ! -f /scratch/restart-me ]; do sleep 1; done
          rm -f /scratch/restart-me
          exit 1
      volumeMounts:
        - name: scratch
          mountPath: /scratch
    - name: reader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
        - name: cache
          mountPath: /cache
