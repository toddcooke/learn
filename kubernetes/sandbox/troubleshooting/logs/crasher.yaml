# A container that says why it is about to die, and then dies.
#
# This is the shape of the problem `kubectl logs --previous` exists for. The
# container prints its diagnosis, exits non-zero, and the kubelet — obeying the
# default restartPolicy: Always — starts a fresh instance. Ask for the logs
# without --previous and you are asking about the instance that is running (or
# waiting to run) right now, which has not reached the interesting part yet.
# The explanation is in the corpse.
#
# Pinned to cka-sandbox-worker so the lab can watch the per-restart log files
# accumulate on one known node.
apiVersion: v1
kind: Pod
metadata:
  name: crasher
  labels:
    app: crasher
spec:
  nodeSelector:
    kubernetes.io/hostname: cka-sandbox-worker
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        # The sleep matters. A container that prints and exits within the same
        # millisecond is restarted immediately and its predecessor is reaped
        # almost as fast, so `kubectl logs --previous` intermittently answers
        # "unable to retrieve container logs" — the container it would have
        # read is already gone. Living a few seconds keeps the corpse around
        # long enough to be examined, which is the entire point of the lab.
        - 'echo "CRASH-MARKER: opening /etc/app/config.yaml"; echo "CRASH-MARKER: no such file - giving up"; sleep 5; exit 1'
