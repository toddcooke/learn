# Three replicas that each stamp their own Pod name into their output.
#
# The point of this Deployment is `kubectl logs -l app=fleet`. A selector turns
# `logs` from a single-Pod command into a fan-out across every matching Pod,
# which is what you actually want when a Deployment misbehaves and you do not
# yet know which replica is at fault. Each Pod's output has to be identifiable
# for that to be worth anything, hence the downward-API environment variable.
#
# `$POD_NAME` is plain shell syntax. Kubernetes only expands the `$(VAR)` form
# in args, so this passes through untouched and busybox's sh reads it out of
# the environment the kubelet built from the fieldRef below.
#
# No nodeSelector here: the scheduler spreads these however it likes, which is
# the situation a selector-based `logs` is meant for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet
  labels:
    app: fleet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fleet
  template:
    metadata:
      labels:
        app: fleet
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["sh", "-c"]
          args:
            - 'echo "FLEET $POD_NAME line 1"; echo "FLEET $POD_NAME line 2"; echo "FLEET $POD_NAME line 3"; sleep 3600'
