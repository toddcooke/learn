# Breakage 3: the container starts cleanly and then exits non-zero.
#
# This stands in for the commonest crash of all — a process that comes up,
# discovers its configuration is missing or wrong, complains, and gives up.
# The complaint is written on purpose: it is the only evidence of what went
# wrong, it lives in the log of a container that no longer exists, and
# `kubectl logs --previous` is how you get it back.
apiVersion: v1
kind: Pod
metadata:
  name: crashloop
  labels:
    demo: pod-failure-states
    failure: crashloop
spec:
  # Always is already the default for a Pod; it is written out because the
  # restart is what produces the loop. With restartPolicy Never this same
  # container would simply leave a Failed Pod behind and stop there.
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "starting up"
          echo "FATAL: config file /etc/app/config.yaml not found" >&2
          echo "giving up"
          exit 1
