# The Pod every probe in this lab is issued from. Debugging a Service from
# outside the cluster tests a different set of things (Ingress, NodePort, the
# host's routing table); the checklist this lab follows is about in-cluster
# traffic, so the caller must live in the cluster.
#
# Two containers, because no single image here carries both tools:
#
#   * shell (busybox) has wget, which prints the response body. That matters
#     because the lab has to read *which* backend answered; a bare TCP connect
#     would only report that something accepted the connection.
#   * dns (agnhost) has nslookup, the tool the upstream DNS-debugging task
#     recommends — newer busybox builds have a chequered history with nslookup
#     and search domains.
#
# Containers in a Pod share a network namespace, so both read the identical
# /etc/resolv.conf and present the identical source address. The name the dns
# container resolves is therefore the name the shell container is calling, not a
# second opinion from somewhere else in the cluster.
#
# The label is app=client, deliberately not app=hostnames. A client that matched
# the Service's selector would insert itself into the very EndpointSlice the lab
# is counting, and every endpoint count below would be off by one.
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
    - name: dns
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
