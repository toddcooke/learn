# The subPath trap, on its own so nothing it does can be blamed on the Pod in
# consumer.yaml.
#
# subPath is resolved once, at mount time, and bind-mounts that single path
# into the container. When the ConfigMap changes, the kubelet writes a new
# timestamped data directory and re-points the volume's hidden ..data symlink
# at it — but that swap happens *behind* this bind mount, which still refers to
# the file it resolved at startup. The result is a mount that looks like a
# volume mount and behaves like an environment variable: frozen for the life of
# the container.
apiVersion: v1
kind: Pod
metadata:
  name: pinned
  labels:
    app: pinned
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: appconfig
          mountPath: /etc/pinned/GREETING
          subPath: GREETING
          readOnly: true
  volumes:
    - name: appconfig
      configMap:
        name: app-literal
