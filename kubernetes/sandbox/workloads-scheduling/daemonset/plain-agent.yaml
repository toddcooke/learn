# A DaemonSet with no tolerations written by hand. It is the naive version:
# "run this on every node." On this cluster it reaches only two of the three,
# because the control-plane node carries a NoSchedule taint and the tolerations
# the DaemonSet controller adds for free cover node *conditions*, never node
# *roles*. Its only job in this lab is to be the before picture.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: plain-agent
  labels:
    app: plain-agent
spec:
  selector:
    matchLabels:
      app: plain-agent
  template:
    metadata:
      labels:
        app: plain-agent
    spec:
      # The default 30s would make the lab wait half a minute to watch Pods
      # disappear. Nothing here holds state worth draining.
      terminationGracePeriodSeconds: 5
      containers:
        - name: agent
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/agnhost", "netexec", "--http-port=8080"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
