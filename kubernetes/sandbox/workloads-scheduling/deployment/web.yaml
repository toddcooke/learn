# A Deployment with the conservative update strategy you want for something
# that must not lose capacity while it is being upgraded: add one extra Pod,
# never let one go missing. maxUnavailable: 0 is also what makes this lab
# assertable — .status.availableReplicas must stay at 3 for the whole rollout.
#
# The two images differ only by tag (agnhost 2.52 -> 2.53). That is deliberate:
# the lab is about the machinery of a rollout, not about the app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  annotations:
    # kubectl's --record flag is gone, so nothing populates change-cause for
    # you any more. The Deployment controller copies annotations from the
    # Deployment onto whichever ReplicaSet is currently the "new" one, and
    # that ReplicaSet is where `kubectl rollout history` reads the
    # CHANGE-CAUSE column from.
    kubernetes.io/change-cause: "initial rollout: agnhost 2.52"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  # A new Pod counts as available only after it has been Ready this long.
  # It slows the rollout down enough to watch, and it is the knob that stops
  # a Pod that crashes two seconds after starting from being called healthy.
  minReadySeconds: 2
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.52
          command: ["/agnhost", "netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          # Without a readinessProbe, "Ready" means only "the process
          # started", and maxUnavailable: 0 would guarantee a lot less than
          # it appears to.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
