# The same Job as sidecar-job.yaml with the log shipper demoted to an ordinary
# container. Nothing else changes.
#
# A Pod reaches Succeeded only when every regular container has terminated, so
# a companion process declared here holds the Pod in Running forever after the
# real work is finished, and the Job never records a completion. This is the
# failure mode the sidecar feature was introduced to fix, and before Kubernetes
# 1.28 the only workarounds were application-level: have the main container
# poke a shutdown endpoint on the sidecar, or share a volume and use a
# sentinel file.
apiVersion: batch/v1
kind: Job
metadata:
  name: no-sidecar
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: no-sidecar
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 5
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "main: doing the work"
              sleep 5
              echo "main: done, exiting 0"
        - name: log-shipper
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/agnhost", "netexec", "--http-port=9090"]
