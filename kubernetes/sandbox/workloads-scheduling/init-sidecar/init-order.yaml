# Two init containers and one app container. Init containers run one at a
# time, in declaration order, and each must exit 0 before the next one is
# started; the app container is not started until all of them have finished.
#
# Each init container sleeps 12 seconds so that `kubectl get pod` can be
# caught in the act showing Init:0/2 and then Init:1/2 — the run script polls
# for exactly those two strings.
#
# The ordering is also visible in the filesystem rather than only in the
# status column: warm-cache refuses to run unless fetch-config has already
# written /work/config, and the app container refuses to start unless both
# files are there. If Kubernetes ran these concurrently, the Pod would fail
# instead of quietly proving nothing.
apiVersion: v1
kind: Pod
metadata:
  name: init-order
  labels:
    app: init-order
spec:
  volumes:
    - name: work
      emptyDir: {}
  initContainers:
    - name: fetch-config
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "fetch-config: starting"
          sleep 12
          echo "listen=8080" > /work/config
          echo "fetch-config: wrote /work/config, exiting 0"
      volumeMounts:
        - name: work
          mountPath: /work
    - name: warm-cache
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          if [ ! -f /work/config ]; then
            echo "warm-cache: /work/config is missing — init containers did not run in order"
            exit 1
          fi
          echo "warm-cache: read config: $(cat /work/config)"
          sleep 12
          echo warm > /work/cache
          echo "warm-cache: wrote /work/cache, exiting 0"
      volumeMounts:
        - name: work
          mountPath: /work
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command:
        - sh
        - -c
        - |
          if [ ! -f /work/config ] || [ ! -f /work/cache ]; then
            echo "app: init output missing — the app container started too early"
            exit 1
          fi
          exec /agnhost netexec --http-port=8080
      volumeMounts:
        - name: work
          mountPath: /work
