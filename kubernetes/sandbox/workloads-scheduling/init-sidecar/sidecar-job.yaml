# A Job whose Pod carries a long-running log shipper as a native sidecar.
#
# Compare this file with blocking-job.yaml line by line: the two are identical
# except that here log-shipper sits in .spec.template.spec.initContainers with
# restartPolicy: Always, and there it sits in .spec.template.spec.containers.
# Same image, same command, same container name. That one relocation is the
# entire difference between a Job that finishes and a Job that hangs forever.
#
# restartPolicy: Always on an init container is legal even though the Pod's
# own restartPolicy is Never — the two fields answer different questions. The
# Pod-level policy says what happens when a regular container exits; the
# container-level policy on an init container says whether this container is a
# run-once step or a companion process.
apiVersion: batch/v1
kind: Job
metadata:
  name: with-sidecar
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: with-sidecar
    spec:
      restartPolicy: Never
      # When the main container exits, the kubelet SIGTERMs the sidecar and
      # waits. Five seconds keeps the lab quick if netexec ignores the signal.
      terminationGracePeriodSeconds: 5
      initContainers:
        - name: log-shipper
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          restartPolicy: Always
          command: ["/agnhost", "netexec", "--http-port=9090"]
      containers:
        - name: main
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "main: doing the work"
              sleep 5
              echo "main: done, exiting 0"
