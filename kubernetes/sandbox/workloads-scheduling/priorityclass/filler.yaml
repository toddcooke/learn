# TEMPLATE — this file is not applied as-is. run.sh substitutes __NODE__ and
# __CPU_LOW__ first, because the only honest CPU request here is one derived
# from what the target node actually has free. Hardcoding "700m" would either
# leave the node half empty on a big machine (no preemption, nothing proved) or
# refuse to schedule at all on a small one.
#
# Six replicas, all pinned to one node. Pinning is what makes "the cluster is
# full" a statement this lab controls exactly: an evicted replica has nowhere
# else to go, so it stays Pending where you can see it.
#
# The container runs `sleep` as PID 1. A process with no SIGTERM handler that is
# PID 1 of its namespace does not get the signal at all, so a preempted filler
# takes the full terminationGracePeriodSeconds to die. That is normally a bug;
# here it is the point, because it holds the drain window open long enough to
# watch .status.nominatedNodeName on the Pod doing the preempting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filler
  labels:
    app: filler
spec:
  replicas: 6
  selector:
    matchLabels:
      app: filler
  template:
    metadata:
      labels:
        app: filler
    spec:
      priorityClassName: sandbox-priorityclass-low
      nodeSelector:
        kubernetes.io/hostname: __NODE__
      terminationGracePeriodSeconds: 15
      containers:
        - name: filler
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: __CPU_LOW__
