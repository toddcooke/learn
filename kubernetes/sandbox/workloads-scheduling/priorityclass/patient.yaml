# TEMPLATE — run.sh substitutes __NODE__ and __CPU_HIGH__ before applying.
#
# The controlled comparison against urgent.yaml: byte-for-byte the same request
# on the same node at the same priority value, differing only in which
# PriorityClass it names. This one has preemptionPolicy: Never, so the scheduler
# will queue it ahead of the low-priority Pods but will not evict any of them
# on its behalf. It sits Pending until room appears on its own.
apiVersion: v1
kind: Pod
metadata:
  name: patient
  labels:
    app: patient
spec:
  priorityClassName: sandbox-priorityclass-high-nopreempt
  nodeSelector:
    kubernetes.io/hostname: __NODE__
  terminationGracePeriodSeconds: 5
  containers:
    - name: patient
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["/agnhost", "netexec", "--http-port=8080"]
      resources:
        requests:
          cpu: __CPU_HIGH__
