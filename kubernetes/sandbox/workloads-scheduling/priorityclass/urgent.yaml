# TEMPLATE — run.sh substitutes __NODE__ and __CPU_HIGH__ before applying.
#
# This Pod is identical to patient.yaml in every respect except its
# priorityClassName. Same node, same CPU request, same image, same priority
# VALUE (1000000). The only difference is that this class leaves
# preemptionPolicy at its default of PreemptLowerPriority, so when the Pod does
# not fit the scheduler is allowed to delete lower-priority Pods until it does.
apiVersion: v1
kind: Pod
metadata:
  name: urgent
  labels:
    app: urgent
spec:
  priorityClassName: sandbox-priorityclass-high
  nodeSelector:
    kubernetes.io/hostname: __NODE__
  terminationGracePeriodSeconds: 5
  containers:
    - name: urgent
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["/agnhost", "netexec", "--http-port=8080"]
      resources:
        requests:
          cpu: __CPU_HIGH__
