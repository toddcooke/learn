# The same experiment run against memory instead of CPU. Memory that a
# process has already been given cannot be taken back the way CPU time
# can be withheld, so when the cgroup's charge fails the kernel's only
# remaining move is to kill a process inside it.
#
# Two details here were arrived at the hard way, and both are real
# production mistakes rather than sandbox trivia.
#
# 1. The limit is 64Mi, not something tighter. runc's own init process is
#    charged to this cgroup before it can exec the workload, so a limit
#    that is too small kills the container during startup and the kubelet
#    reports something else entirely:
#
#      reason: StartError
#      message: ... container init was OOM-killed (memory limit too low?)
#
#    That is a different failure with a different fix, and it looks like a
#    crash loop, so it is easy to misread as an application bug.
#
# 2. The memory is allocated anonymously, not by filling a memory-backed
#    emptyDir. A tmpfs volume would also be charged to this cgroup — which
#    is the usual reason a "cache" volume starts killing containers — but
#    sizing that filesystem happens during container setup, so a tmpfs
#    larger than the limit reproduces failure (1) instead of the OOM kill
#    this Pod is here to show.
apiVersion: v1
kind: Pod
metadata:
  name: oom-hog
  labels:
    demo: limits
spec:
  # Always is the default; it is spelled out because the restart is what
  # makes this readable. Once the kubelet starts a fresh container, the
  # kill that just happened moves out of .state and into .lastState,
  # which is where kubectl describe reads "Last State: Terminated" from.
  restartPolicy: Always
  containers:
    - name: hog
      image: busybox:1.36
      resources:
        # Request equals limit — for memory only. That is deliberately
        # not enough for Guaranteed, which also needs cpu pinned the same
        # way, so this Pod lands in Burstable.
        requests:
          memory: "64Mi"
        limits:
          memory: "64Mi"
      command: ["sh", "-c"]
      args:
        - |
          echo "memory limit for this container is 64Mi"

          # Each pass doubles a shell variable, so the process really is
          # holding every byte it reports. The node has no swap, so there
          # is nowhere to put anonymous pages: the kernel cannot reclaim
          # its way out of the charge that crosses 64Mi, and the memory
          # cgroup's OOM killer takes this process with it. The run ends
          # partway through the doubling that would have crossed the line.
          blob=x
          size=1
          while true; do
            blob="$blob$blob"
            size=$(( size * 2 ))
            echo "holding ~$size bytes"
          done
