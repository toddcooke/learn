# A plain Pod used only as a place to run DNS lookups and HTTP requests from.
# Its label is deliberately app: client, not app: web, so it never matches the
# headless Service's selector and never shows up as one of its endpoints.
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels:
    app: client
spec:
  containers:
    - name: client
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: ["sleep", "3600"]
